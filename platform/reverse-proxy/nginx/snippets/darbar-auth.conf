# ─────────────────────────────────────────────────────────
# Darbar Platform Services — Basic Auth Gate
#
# All platform tooling behind *.darbar.* requires auth.
# Shared credentials for the ops team.
#
# Generate the htpasswd file on the host:
#   htpasswd -c platform/reverse-proxy/nginx/.htpasswd ops_admin
#
# Add more users:
#   htpasswd platform/reverse-proxy/nginx/.htpasswd another_user
# ─────────────────────────────────────────────────────────
auth_basic "Darbar — Platform Services";
auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
