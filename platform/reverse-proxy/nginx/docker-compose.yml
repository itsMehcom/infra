services:
  nginx:
    image: nginx:1.31.8-alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "${NGINX_PORT_HTTP:-80}:80"
      - "${NGINX_PORT_HTTPS:-443}:443"

    env_file:
      - ../../../environments/production/global.env

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates:/etc/nginx/templates:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ../../../logs/nginx:/var/log/nginx
      - ./.htpasswd:/etc/nginx/conf.d/.htpasswd:ro
      # - ../../..//certs:/etc/nginx/certs:ro

    networks:
      - public
      - internal

    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  public:
    driver: bridge

  internal:
    external: true
