services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: postgres
    restart: unless-stopped

    env_file:
      - ../../environments/production/postgres.env

    volumes:
      - pgdata:/var/lib/postgresql
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./backups:/backups
      - ../../../logs/postgres:/var/log/postgresql

    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf

    networks:
      - internal

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-itsmeh_admin}" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 2G
  # ─────────────────────────────────────────────────────────
  # PgBouncer — Connection Pooler
