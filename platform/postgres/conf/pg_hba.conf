# ╔═══════════════════════════════════════════════════════════╗
# ║  PostgreSQL — Host-Based Authentication (HBA)             ║
# ║  ItsMeh Platform Database Service                         ║
# ╚═══════════════════════════════════════════════════════════╝
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# Reference: https://www.postgresql.org/docs/18/auth-pg-hba-conf.html


# ─────────────────────────────────────────────────────────
# Local connections (inside the container)
# ─────────────────────────────────────────────────────────

# Superuser can connect locally (used by backup scripts, health checks)
local   all             all                                     scram-sha-256

# Loopback connections (used by pg_isready health checks)
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256


# ─────────────────────────────────────────────────────────
# Docker internal network
# ─────────────────────────────────────────────────────────
# Covers Docker's default bridge range (172.16.0.0/12).
# All services on the 'internal' Docker network connect through here.

host    all             all             172.16.0.0/12           scram-sha-256


# ─────────────────────────────────────────────────────────
# Deny everything else
# ─────────────────────────────────────────────────────────
# Any connection not matching the rules above is rejected.

host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
