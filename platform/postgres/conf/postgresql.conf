# ╔═══════════════════════════════════════════════════════════╗
# ║  PostgreSQL — Production Configuration                    ║
# ║  ItsMeh Platform Database Service                         ║
# ╚═══════════════════════════════════════════════════════════╝
#
# This file overrides defaults from postgres image.
# Only settings that differ from defaults are listed here.
# Reference: https://www.postgresql.org/docs/18/runtime-config.html


# ─────────────────────────────────────────────────────────
# Connection Settings
# ─────────────────────────────────────────────────────────

listen_addresses = '*'
port = 5432

# Each service should pool its own connections (e.g., Phoenix DBConnection).
# Adjust if you add many services or enable PgBouncer.
max_connections = 200


# ─────────────────────────────────────────────────────────
# Memory
# ─────────────────────────────────────────────────────────
# Tune these based on your server's available RAM.
# Rule of thumb: shared_buffers = 25% of RAM, effective_cache_size = 75% of RAM.
# Below values assume a server with ~4 GB RAM dedicated to PostgreSQL.

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB


# ─────────────────────────────────────────────────────────
# WAL (Write-Ahead Log)
# ─────────────────────────────────────────────────────────
# wal_level = replica supports both archiving (PITR) and
# future streaming replication without needing a restart.

wal_level = replica
max_wal_senders = 5
max_wal_size = 2GB
min_wal_size = 512MB


# ─────────────────────────────────────────────────────────
# Archiving — Required for Point-in-Time Recovery (PITR)
# ─────────────────────────────────────────────────────────
# WAL segments are archived to /backups/wal/ which is
# bind-mounted from platform/postgres/backups/wal/ on the host.

archive_mode = on
archive_command = 'test ! -f /backups/wal/%f && cp %p /backups/wal/%f'
archive_timeout = 300


# ─────────────────────────────────────────────────────────
# Checkpoints
# ─────────────────────────────────────────────────────────

checkpoint_timeout = 10min
checkpoint_completion_target = 0.9


# ─────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────
# CSV format for structured log ingestion.
# Logs are written to /var/log/postgresql/ (bind-mounted to logs/postgres/).

logging_collector = on
log_destination = 'csvlog'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = off

# Log slow queries (>= 500ms). Set to 0 to log all queries.
log_min_duration_statement = 500

# Log connection/disconnection events for auditing.
log_connections = on
log_disconnections = on

# Log lock waits longer than 1 second.
log_lock_waits = on
deadlock_timeout = 1s

# Log DDL and data-modifying statements for security auditing.
log_statement = 'ddl'


# ─────────────────────────────────────────────────────────
# Query Planner
# ─────────────────────────────────────────────────────────

random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100


# ─────────────────────────────────────────────────────────
# Autovacuum
# ─────────────────────────────────────────────────────────

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025


# ─────────────────────────────────────────────────────────
# Locale & Formatting
# ─────────────────────────────────────────────────────────

timezone = 'Asia/Kolkata'
lc_messages = 'en_US.UTF-8'
